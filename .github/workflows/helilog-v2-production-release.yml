name: HeliLog production root release gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify root V2 deployment, isolated Supabase and same-origin V1 archive
        run: node --test scripts/check-live-root.test.cjs
      - name: Run complete V2.43 staging regression suite against production candidate sources
        run: node scripts/check-helilog-v2.cjs
      - name: Re-run production and manual-account regressions
        run: |
          node --test scripts/production-release.test.cjs supabase/production/bootstrap.test.cjs
          node --test v2/v217-manual-accounts.test.cjs v2/v212-account-recovery.test.cjs v2/v213-private-account-safety.test.cjs
          node --test v2/v218-night-calculation.test.cjs v2/v219-aerodromes-utc.test.cjs
          node --test v2/v29-backup-recovery.test.cjs v2/v210-backup-health.test.cjs v2/v28-integrity-recovery.test.cjs
          node --test v2/v24-sync.test.cjs v2/v25-profile-pic.test.cjs v2/v27-cloud-ui.test.cjs
          node --test v2/v220-dark-cockpit.test.cjs v2/v220-sync-pill.test.cjs v2/v225-print-cleanup.test.cjs v2/v226-help-guide.test.cjs
          node --test v2/v227-pilot-signatures.test.cjs v2/v228-cloud-onboarding.test.cjs v2/v2281-conflict-review.test.cjs v2/v2282-person-recovery.test.cjs v2/v2283-safe-recovery.test.cjs v2/v2284-selective-recovery.test.cjs
          node --test v2/v229-prearchive-review.test.cjs v2/v230-special-ops-import.test.cjs v2/v231-compact-quick.test.cjs v2/v2311-onehand-layout.test.cjs v2/v2313-review-navigation.test.cjs v2/v2314-quick-scroll.test.cjs


