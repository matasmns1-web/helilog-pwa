name: HeliLog V2 staging regression tests

on:
  pull_request:
    branches: [v2/development]
  push:
    branches: [v2/development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helilog-v2-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout V2 source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify build, logbook, print, sync, archives and production separation
        run: node scripts/check-helilog-v2.cjs
