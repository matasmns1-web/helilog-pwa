name: HeliLog V2 staging regression tests

on:
  pull_request:
    branches: [v2/development]
  push:
    branches: [v2/development]

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production database overlay is safe
        run: node --test supabase/production/bootstrap.test.cjs
      - name: Test isolated V2 production candidate packaging
        run: |
          node --test scripts/production-release.test.cjs
      - name: Test backups, restore and archived records
        run: |
          node --test v2/v29-backup-recovery.test.cjs v2/v210-backup-health.test.cjs v2/v211-interface-layout.test.cjs v2/v212-account-recovery.test.cjs v2/v213-private-account-safety.test.cjs v2/v215-invitation-acceptance.test.cjs v2/v217-manual-accounts.test.cjs v2/v218-night-calculation.test.cjs
          node --test v2/v27-offline-conflicts.test.cjs v2/v28-integrity-recovery.test.cjs v2/v282-corrections.test.cjs v2/v283-correction-confirmation.test.cjs v2/v284-stranded-corrections.test.cjs
          node --test v2/v24-sync.test.cjs v2/v25-profile-pic.test.cjs v2/v26-login-ui.test.cjs v2/v27-cloud-ui.test.cjs v2/v281-archive-readiness.test.cjs
